# Development server Frontend di Docker (Node 22 + Vite 6 HMR via Docker Compose v5 Watch).
#
#   docker compose up --watch     -> Frontend di http://localhost:5173 dengan HMR instan
#
# Nilai default dibaca dari .env.example lalu ditimpa otomatis oleh .env.local jika ada.
name: djc-frontend

services:
  frontend:
    build:
      context: .
      target: dev
    env_file:
      - path: .env.example
        required: true
      - path: .env.local
        required: false
    ports:
      - '5173:5173'
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: sync
          path: ./index.html
          target: /app/index.html
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./vite.config.js
    restart: unless-stopped
